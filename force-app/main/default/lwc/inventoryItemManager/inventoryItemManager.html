<template>
     <lightning-card title="Create Inventory Item">
      <div class="slds-m-bottom_small">
        <lightning-record-edit-form object-api-name="Inventory_Item__c"  onsuccess={handleSuccess} onerror={handleError} >
          <lightning-messages></lightning-messages>
          <lightning-input-field field-name="Name"></lightning-input-field>
          <lightning-input-field field-name="SKU__c"></lightning-input-field>
          <lightning-input-field field-name="Category__c"></lightning-input-field>
          <lightning-input-field field-name="Unit_Cost__c"></lightning-input-field>
          <lightning-input-field field-name="Active__c"></lightning-input-field>
          <lightning-button class="slds-m-top_small" type="submit" label="Save"></lightning-button>
        </lightning-record-edit-form>
      </div>
     </lightning-card> 
     <lightning-card title="List Inventory Item">
     <div>
     <template lwc:if={inventoryItems}>
      <template for:each={inventoryItems} for:item="item" >
        <p key={item.SKU__c}>
         {item.Name} - {item.SKU__c} - {item.Category__c} - {item.Unit_Cost__c} 
        </p>
      </template>
     </template>
      <template lwc:if={error}>
         <p class="slds-text-color_error">
                     Error: {errorMessage}
        </p>
      </template>
     </div>
     </lightning-card> 
</template>
